<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.json"><title>Entrenar</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px 95px}.wrap{max-width:680px;margin:auto}.muted{color:#9aa4b2}.card{background:#171d26;border:1px solid #293241;border-radius:20px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:13px;padding:13px;background:#252e3b;color:white;font-size:15px}.active{outline:2px solid #7c5cff}.stars{font-size:28px;margin:15px 0}button.save{width:100%;background:#7c5cff}.machine{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #293241}input{width:90px;padding:9px;border-radius:9px;border:1px solid #293241;background:#0e141b;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1117ee;border-top:1px solid #293241;padding:9px 10px;display:flex;justify-content:space-around}.nav a{color:#9aa4b2;text-decoration:none;font-size:12px;text-align:center}.nav .active{color:#fff}.nav span{display:block;font-size:20px}</style></head><body><div class="wrap"><h1>💪 Entrenar</h1><p class="muted">Registra tus clases y tus pesos.</p><div class="card"><h2>Clase de hoy</h2><div class="grid"><button class="cls" data-t="Body Pump">🏋️ Body Pump</button><button class="cls" data-t="Body Balance">🧘 Body Balance</button></div><p id="chosen" class="muted">Selecciona una clase</p><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div><button class="save" id="saveClass">Guardar clase</button></div><div class="card"><h2>Mis máquinas</h2><div id="machines"></div><div id="empty" class="muted">No tienes máquinas guardadas todavía.</div></div></div><nav class="nav"><a href="index.html"><span>🏠</span>Inicio</a><a class="active" href="entrenamiento.html"><span>💪</span>Entrenar</a><a href="running.html"><span>🏃</span>Running</a><a href="historial.html"><span>📊</span>Progreso</a></nav><script>
let type="",intensity=3;document.querySelectorAll(".cls").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll(".cls").forEach(x=>x.classList.remove("active"));b.classList.add("active");chosen.textContent=type});stars.onclick=e=>{const n=Math.max(1,Math.min(5,Math.round((e.offsetX/e.target.clientWidth)*5)));intensity=n;stars.textContent="★ ".repeat(n)+"☆ ".repeat(5-n)};saveClass.onclick=()=>{if(!type)return alert("Selecciona una clase.");const a=JSON.parse(localStorage.getItem("gym-workouts-v1")||"[]");a.push({type,intensity,date:new Date().toISOString()});localStorage.setItem("gym-workouts-v1",JSON.stringify(a));alert("Clase guardada 💪")};
const m=JSON.parse(localStorage.getItem("gym-weights-v1")||"{}"),hkey="gym-weights-history-v1";Object.keys(m).forEach(n=>{empty.style.display="none";const d=document.createElement("div");d.className="machine";d.innerHTML=`<div><strong>${n}</strong><div class="muted">Actual: ${m[n]} kg</div></div><div><input id="i${btoa(unescape(encodeURIComponent(n))).replace(/=/g,'')}" type="number" step=".5" value="${m[n]}"><button>Guardar</button></div>`;const i=d.querySelector("input"),b=d.querySelector("button");b.onclick=()=>{const w=Number(i.value);if(!w)return;m[n]=w;localStorage.setItem("gym-weights-v1",JSON.stringify(m));const h=JSON.parse(localStorage.getItem(hkey)||"[]");h.push({name:n,weight:w,date:new Date().toISOString()});localStorage.setItem(hkey,JSON.stringify(h));alert("Peso actualizado")};machines.appendChild(d)});navigator.serviceWorker?.register("sw.js");</script></body></html>
