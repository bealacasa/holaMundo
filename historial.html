<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.json"><title>Mi progreso</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px 95px}.wrap{max-width:680px;margin:auto}.muted{color:#9aa4b2}.card{background:#171d26;border:1px solid #293241;border-radius:20px;padding:18px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#10151d;border-radius:14px;padding:12px;text-align:center}.num{font-weight:800;font-size:21px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #293241}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1117ee;border-top:1px solid #293241;padding:9px 10px;display:flex;justify-content:space-around}.nav a{color:#9aa4b2;text-decoration:none;font-size:12px;text-align:center}.nav .active{color:#fff}.nav span{display:block;font-size:20px}</style></head><body><div class="wrap"><h1>📊 Mi progreso</h1><p class="muted">Una visión sencilla de cómo estás avanzando.</p><div class="card"><div class="stats"><div class="stat"><div class="num" id="km">0</div><div>km totales</div></div><div class="stat"><div class="num" id="runCount">0</div><div>runs</div></div><div class="stat"><div class="num" id="classCount">0</div><div>clases</div></div></div></div><div class="card"><h2>Progreso de máquinas</h2><div id="weights" class="muted">No hay historial todavía.</div></div><div class="card"><h2>Actividad reciente</h2><div id="activity" class="muted">Sin actividad.</div></div></div><nav class="nav"><a href="index.html"><span>🏠</span>Inicio</a><a href="entrenamiento.html"><span>💪</span>Entrenar</a><a href="running.html"><span>🏃</span>Running</a><a class="active" href="historial.html"><span>📊</span>Progreso</a></nav><script>
const get=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),r=get("gym-running-v1",[]),c=get("gym-workouts-v1",[]),h=get("gym-weights-history-v1",[]);km.textContent=r.reduce((s,x)=>s+Number(x.distance||0),0).toFixed(1);runCount.textContent=r.length;classCount.textContent=c.length;const g={};h.forEach(x=>(g[x.name]??=[]).push(x));weights.innerHTML=Object.keys(g).map(n=>{const a=g[n].sort((x,y)=>new Date(x.date)-new Date(y.date)),d=a[a.length-1].weight-a[0].weight;return `<div class="row"><span><strong>${n}</strong><br><small>${a.length} registros</small></span><span>${a[a.length-1].weight} kg<br><small>${d>0?"+":""}${d} kg</small></span></div>`}).join("")||"No hay historial todavía.";const acts=[...r.map(x=>({d:x.date,t:"🏃 "+x.distance+" km"})),...c.map(x=>({d:x.date,t:"💪 "+x.type})),...h.map(x=>({d:x.date,t:"⚖️ "+x.name+" · "+x.weight+" kg"}))].sort((a,b)=>new Date(b.d)-new Date(a.d));activity.innerHTML=acts.slice(0,12).map(x=>`<div class="row"><span>${x.t}</span><span class="muted">${new Date(x.d).toLocaleDateString("es-ES")}</span></div>`).join("")||"Sin actividad.";navigator.serviceWorker?.register("sw.js");</script></body></html>
