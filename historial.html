<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Weights">
  <title>Historial · Gym Weights</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      color-scheme: dark;
      --card: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.12);
      --muted: #8b949e;
      --blue: #1f6feb;
      --red: #da3633;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #0d1117, #161b22);
      color: #fff;
      padding: max(20px, env(safe-area-inset-top)) 16px
               max(24px, env(safe-area-inset-bottom)) 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      padding: 14px 4px 22px;
    }

    .badge {
      display: inline-block;
      background: #238636;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 13px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .nav a {
      text-decoration: none;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      color: #c9d1d9;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
      font-weight: 700;
    }

    .nav a.active {
      color: #fff;
      background: rgba(31,111,235,.35);
      border-color: rgba(88,166,255,.4);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      align-items: center;
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: #fff;
      border-radius: 13px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    .clear {
      border: 0;
      background: transparent;
      color: #ff7b72;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 5px;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 2px 12px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .history-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .machine-name {
      font-size: 16px;
      font-weight: 700;
    }

    .date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .weight {
      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
    }

    .weight small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #6e7681;
      font-size: 11px;
      padding: 8px 0 4px;
    }

    @media (max-width: 360px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <span class="badge">PWA · GYM</span>
      <h1>Historial</h1>
      <p class="subtitle">Consulta todos los pesos que has ido registrando en tus máquinas.</p>
    </header>

    <nav class="nav" aria-label="Navegación">
      <a href="index.html">Mis pesos</a>
      <a href="historial.html" class="active">Historial</a>
    </nav>

    <section class="card">
      <div class="toolbar">
        <select id="filter">
          <option value="all">Todas las máquinas</option>
        </select>
        <button class="clear" id="clearHistory">Borrar historial</button>
      </div>

      <div class="summary" id="summary"></div>
      <div id="history"></div>
    </section>

    <div class="footer">El historial se guarda en este dispositivo.</div>
  </main>

  <script>
    const HISTORY_KEY = "gym-weights-history-v1";
    const filter = document.getElementById("filter");
    const historyEl = document.getElementById("history");
    const summaryEl = document.getElementById("summary");

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch {
        return [];
      }
    }

    function formatNumber(value) {
      return Number.isInteger(value) ? value : String(value).replace(".", ",");
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(iso) {
      const date = new Date(iso);
      return new Intl.DateTimeFormat("es-ES", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function populateFilter(history) {
      const current = filter.value;
      const names = [...new Set(history.map(item => item.name))].sort((a, b) => a.localeCompare(b, "es"));

      filter.innerHTML = '<option value="all">Todas las máquinas</option>' +
        names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");

      if (names.includes(current)) filter.value = current;
    }

    function render() {
      const history = getHistory();
      populateFilter(history);

      const selected = filter.value;
      const visible = selected === "all"
        ? history
        : history.filter(item => item.name === selected);

      summaryEl.textContent = `${visible.length} ${visible.length === 1 ? "registro" : "registros"}`;

      if (!visible.length) {
        historyEl.innerHTML = `
          <div class="empty">
            Todavía no hay registros.<br>
            Cuando cambies un peso aparecerá aquí.
          </div>`;
        return;
      }

      historyEl.innerHTML = visible.map(item => `
        <div class="history-item">
          <div>
            <div class="machine-name">${escapeHtml(item.name)}</div>
            <div class="date">${formatDate(item.date)}</div>
          </div>
          <div class="weight">${formatNumber(item.weight)} <small>kg</small></div>
        </div>
      `).join("");
    }

    filter.addEventListener("change", render);

    document.getElementById("clearHistory").addEventListener("click", () => {
      if (!getHistory().length) return;
      if (!confirm("¿Quieres borrar todo el historial? Tus máquinas y sus pesos actuales no se eliminarán.")) return;

      localStorage.removeItem(HISTORY_KEY);
      render();
    });

    render();

    // Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.error("Error registrando Service Worker:", error));
      });
    }
  </script>
</body>
</html>
