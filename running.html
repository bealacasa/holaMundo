<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.json"><title>Running</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px 95px}.wrap{max-width:680px;margin:auto}.muted{color:#9aa4b2}.card{background:#171d26;border:1px solid #293241;border-radius:20px;padding:18px;margin:14px 0}label{display:block;color:#9aa4b2;margin:11px 0 5px}input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #293241;background:#0e141b;color:#fff;font-size:16px}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#10151d;border-radius:14px;padding:12px;text-align:center}.num{font-weight:800;font-size:19px}.small{font-size:11px;color:#9aa4b2}.run{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #293241}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1117ee;border-top:1px solid #293241;padding:9px 10px;display:flex;justify-content:space-around}.nav a{color:#9aa4b2;text-decoration:none;font-size:12px;text-align:center}.nav .active{color:#fff}.nav span{display:block;font-size:20px}</style></head><body><div class="wrap"><h1>🏃 Running</h1><p class="muted">Registra cada salida sin complicarte.</p><div class="card"><h2>Nueva salida</h2><label>Distancia (km)</label><input id="distance" type="number" step=".01"><label>Tiempo (minutos)</label><input id="time" type="number" step=".1"><label>FC media (opcional)</label><input id="hr" type="number"><label>Sensaciones (1–10)</label><input id="feeling" type="number" min="1" max="10" value="7"><label>Notas</label><textarea id="notes" rows="3"></textarea><button id="save">Guardar salida</button></div><div class="card"><h2>Mis estadísticas</h2><div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="small">km</div></div><div class="stat"><div class="num" id="runs">0</div><div class="small">salidas</div></div><div class="stat"><div class="num" id="best">—</div><div class="small">mejor ritmo</div></div><div class="stat"><div class="num" id="longest">0</div><div class="small">km máx.</div></div></div></div><div class="card"><h2>Últimas salidas</h2><div id="list" class="muted">Todavía no hay salidas.</div></div></div><nav class="nav"><a href="index.html"><span>🏠</span>Inicio</a><a href="entrenamiento.html"><span>💪</span>Entrenar</a><a class="active" href="running.html"><span>🏃</span>Running</a><a href="historial.html"><span>📊</span>Progreso</a></nav><script>
const key="gym-running-v1";let runs=JSON.parse(localStorage.getItem(key)||"[]");function pace(x){return x.time/x.distance}function render(){total.textContent=runs.reduce((s,x)=>s+Number(x.distance),0).toFixed(1);document.getElementById("runs").textContent=runs.length;longest.textContent=runs.length?Math.max(...runs.map(x=>Number(x.distance))).toFixed(1):"0";if(runs.length){const p=Math.min(...runs.map(pace));best.textContent=Math.floor(p)+":"+String(Math.round((p%1)*60)).padStart(2,"0")}list.innerHTML=runs.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8).map(x=>{const p=pace(x);return `<div class="run"><span><strong>${Number(x.distance).toFixed(2)} km</strong><br><span class="muted">${new Date(x.date).toLocaleDateString("es-ES")}</span></span><span>${Math.floor(p)}:${String(Math.round((p%1)*60)).padStart(2,"0")}/km</span></div>`}).join("")||"Todavía no hay salidas."}save.onclick=()=>{const d=Number(distance.value),t=Number(time.value);if(!d||!t)return alert("Introduce distancia y tiempo.");runs.push({distance:d,time:t,hr:Number(hr.value)||null,feeling:Number(feeling.value)||null,notes:notes.value,date:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(runs));distance.value="";time.value="";hr.value="";notes.value="";render();alert("Salida guardada 🏃‍♀️")};render();navigator.serviceWorker?.register("sw.js");</script></body></html>
